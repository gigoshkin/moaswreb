<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Moaswreb Today</title>
<link rel="stylesheet" href="base.css">
<style>
  header { padding: 14px 24px 0; display: flex; align-items: center; justify-content: space-between; }
  header .date { font-size: 15px; font-weight: 500; color: var(--ink-2); }

  .hero { margin: 28px 16px 0; padding: 24px 24px 24px; background: var(--lime); border-radius: 32px; }
  .route { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .route .arrow { opacity: .45; font-weight: 400; }
  .leave { margin-top: 24px; font-size: 17px; font-weight: 500; opacity: .6; }
  .count { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .count .n { font-size: 120px; line-height: .95; font-weight: 600; letter-spacing: -0.06em; margin-left: -5px; }
  .count .u { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; }
  .facts { display: flex; gap: 32px; margin-top: 28px; }
  .facts div { display: flex; flex-direction: column; gap: 3px; }
  .facts .k { font-size: 13px; font-weight: 500; opacity: .55; }
  .facts .v { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .board { margin: 12px 16px 0; display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 16px; background: var(--fill); }
  .board .txt { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .board .a { font-size: 15px; font-weight: 600; }
  .board .b { font-size: 14px; color: var(--ink-2); }

  .section { margin-top: 36px; padding: 0 24px 4px; font-size: 13px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.02em; text-transform: uppercase; }
  .row { display: flex; align-items: center; padding: 16px 24px; gap: 16px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 1px; background: var(--line); }
  .row .t { width: 60px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .row .main { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .row .name { font-size: 16px; font-weight: 600; }
  .row .meta { font-size: 14px; color: var(--ink-2); }
  .row .meta .late { color: var(--late); font-weight: 600; }
  .row .routes { display: flex; gap: 4px; }

  nav { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding-top: 10px; background: var(--bg); }
  nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); width: 110px; letter-spacing: 0; }
  nav a.on { color: var(--ink); font-weight: 600; }
  nav svg { width: 24px; height: 24px; }
</style></head>
<body><div class="phone">
  <div class="status"><span>08:37</span><span class="sys"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 11h2V8H1zM5 11h2V6H5zM9 11h2V3H9zM13 11h2V0h-2z" fill="#000"/></svg><span class="bat"></span></span></div>
  <header><span class="date">Saturday, 19 October</span>
    <span class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></header>

  <section class="hero">
    <div class="route">Home <span class="arrow">→</span> University</div>
    <div class="leave">Leave in</div>
    <div class="count"><span class="n">7</span><span class="u">min</span></div>
    <div class="facts">
      <div><span class="k">Leave</span><span class="v">08:44</span></div>
      <div><span class="k">Arrive</span><span class="v">08:57</span></div>
      <div><span class="k">Due</span><span class="v">09:00</span></div>
    </div>
  </section>
  <div class="board">
      <span class="plate">306</span>
      <span class="txt"><span class="a">Vazha-Pshavela Ave</span><span class="b">6 min walk · bus at 08:51</span></span>
    </div>

  <div class="section">Later today</div>
  <div class="row"><span class="t">13:20</span><span class="main"><span class="name">University → Home</span><span class="meta">24 min</span></span><span class="routes"><span class="plate metro">M1</span></span></div>
  <div class="row"><span class="t">17:05</span><span class="main"><span class="name">Home → Gym</span><span class="meta">18 min</span></span><span class="routes"><span class="plate">17</span></span></div>
  <div class="row"><span class="t">21:40</span><span class="main"><span class="name">Gym → Home</span><span class="meta">31 min</span></span><span class="routes"><span class="plate">306</span><span class="plate metro">M1</span></span></div>

  <nav>
    <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</a>
    <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>Chat</a>
    <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>Settings</a>
  </nav>
</div></body></html>
