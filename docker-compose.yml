services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
      # Caddy reaches the server over the docker network; trust its X-Forwarded-For so rate limits see real clients.
      TRUST_PROXY: loopback,uniquelocal
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # HTTPS on the VPS (needed for MCP + push). Set DOMAIN in .env and point DNS at the VPS.
  caddy:
    image: caddy:2
    profiles: ["vps"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [server]
    restart: unless-stopped

volumes:
  data:
  caddy:
