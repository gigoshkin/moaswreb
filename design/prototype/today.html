<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moaswreb Today</title>
<style>
  @font-face { font-family: GSF; src: url(fonts/GoogleSansFlex_400Regular.ttf); font-weight: 400; }
  @font-face { font-family: GSF; src: url(fonts/GoogleSansFlex_500Medium.ttf); font-weight: 500; }
  @font-face { font-family: GSF; src: url(fonts/GoogleSansFlex_600SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: GSF; src: url(fonts/GoogleSansFlex_700Bold.ttf); font-weight: 700; }
  @font-face { font-family: Geo; src: url(fonts/NotoSansGeorgian_400Regular.ttf); font-weight: 400; }
  @font-face { font-family: Geo; src: url(fonts/NotoSansGeorgian_500Medium.ttf); font-weight: 500; }
  @font-face { font-family: Geo; src: url(fonts/NotoSansGeorgian_600SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: Geo; src: url(fonts/NotoSansGeorgian_700Bold.ttf); font-weight: 700; }

  :root {
    --bg: #FFFFFF;
    --ink: #0B0B0C;
    --ink-2: #6E6E73;
    --ink-3: #A8A8AD;
    --line: #EEEEF0;
    --fill: #F5F5F7;
    --accent: #12A150;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: GSF, Geo, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1;
  }
  .phone { width: 412px; height: 915px; position: relative; overflow: hidden; background: var(--bg); margin: 0 auto; }

  .status { height: 36px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500; }
  .status .sys { display: flex; gap: 6px; align-items: center; }
  .status .bat { width: 22px; height: 11px; border: 1.5px solid var(--ink); border-radius: 3px; position: relative; }
  .status .bat::after { content: ""; position: absolute; inset: 1.5px 6px 1.5px 1.5px; background: var(--ink); border-radius: 1px; }

  header { padding: 12px 24px 0; display: flex; align-items: center; justify-content: space-between; }
  header .date { font-size: 15px; font-weight: 500; color: var(--ink-2); }
  .icon-btn { width: 36px; height: 36px; border-radius: 18px; background: var(--fill); display: grid; place-items: center; }

  .hero { padding: 36px 24px 0; }
  .trip { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
  .trip .by { color: var(--ink-2); font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 0 0 rgba(18,161,80,.35); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(18,161,80,.35); } 70% { box-shadow: 0 0 0 8px rgba(18,161,80,0); } 100% { box-shadow: 0 0 0 0 rgba(18,161,80,0); } }

  .leave { margin-top: 20px; font-size: 17px; font-weight: 500; color: var(--ink-2); }
  .count { display: flex; align-items: baseline; gap: 10px; margin-top: -6px; }
  .count .n { font-size: 132px; line-height: 1; font-weight: 600; letter-spacing: -0.055em; margin-left: -6px; }
  .count .u { font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
  .when { margin-top: 10px; font-size: 17px; color: var(--ink-2); }
  .when b { color: var(--ink); font-weight: 600; }

  /* Journey strip: segment widths proportional to minutes */
  .strip { margin-top: 32px; display: flex; align-items: center; gap: 4px; height: 28px; }
  .seg-walk { height: 28px; display: flex; align-items: center; }
  .seg-walk::before { content: ""; width: 100%; height: 3px; background-image: radial-gradient(circle, var(--ink-3) 1.5px, transparent 1.6px); background-size: 7px 3px; background-repeat: repeat-x; }
  .seg-ride { height: 28px; border-radius: 8px; background: var(--ink); color: #fff; display: flex; align-items: center; padding: 0 10px; font-size: 14px; font-weight: 600; }
  .seg-ride.metro { border-radius: 14px; }
  .strip-times { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--ink-3); font-weight: 500; }
  .via { margin-top: 14px; font-size: 15px; color: var(--ink-2); }

  .section { margin-top: 44px; padding: 0 24px 6px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .row { display: flex; align-items: center; padding: 16px 24px; gap: 18px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 1px; background: var(--line); }
  .row .t { width: 64px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .row .main { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .row .name { font-size: 17px; font-weight: 500; }
  .row .routes { display: flex; align-items: center; gap: 5px; }
  .plate { height: 20px; min-width: 20px; padding: 0 6px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
  .plate.metro { border-radius: 10px; }
  .arrow { width: 10px; height: 10px; }
  .row .dur { font-size: 15px; color: var(--ink-3); font-weight: 500; }

  nav { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding-top: 10px; background: var(--bg); }
  nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--ink-3); text-decoration: none; width: 110px; }
  nav a.on { color: var(--ink); font-weight: 600; }
  nav svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>08:37</span><span class="sys"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 11h2V8H1zM5 11h2V6H5zM9 11h2V3H9zM13 11h2V0h-2z" fill="#0B0B0C"/></svg><span class="bat"></span></span></div>

  <header>
    <span class="date">შაბათი, 19 ოქტომბერი</span>
    <span class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
  </header>

  <section class="hero">
    <div class="trip"><span class="dot"></span>უნივერსიტეტი <span class="by">· 09:00-მდე</span></div>
    <div class="leave">გასვლა</div>
    <div class="count"><span class="n">7</span><span class="u">წუთში</span></div>
    <div class="when"><b>08:44</b>-ზე · ჩასვლა 08:57</div>

    <div class="strip">
      <div class="seg-walk" style="flex: 6"></div>
      <div class="seg-ride" style="flex: 9">306</div>
      <div class="seg-walk" style="flex: 2"></div>
    </div>
    <div class="strip-times"><span>08:44</span><span>08:57</span></div>
    <div class="via">6 წთ ფეხით, ვაჟა-ფშაველას გამზირამდე</div>
  </section>

  <div class="section">მოგვიანებით</div>
  <div class="row">
    <span class="t">13:20</span>
    <span class="main"><span class="name">სახლი</span><span class="routes"><span class="plate metro">M1</span></span></span>
    <span class="dur">24 წთ</span>
  </div>
  <div class="row">
    <span class="t">17:05</span>
    <span class="main"><span class="name">სპორტდარბაზი</span><span class="routes"><span class="plate">17</span></span></span>
    <span class="dur">18 წთ</span>
  </div>
  <div class="row">
    <span class="t">21:40</span>
    <span class="main"><span class="name">სახლი</span><span class="routes"><span class="plate">306</span><svg class="arrow" viewBox="0 0 10 10" fill="none" stroke="#A8A8AD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2l3 3-3 3"/></svg><span class="plate metro">M1</span></span></span>
    <span class="dur">31 წთ</span>
  </div>

  <nav>
    <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>დღეს</a>
    <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>ჩატი</a>
    <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>პარამეტრები</a>
  </nav>
</div>
</body>
</html>
