<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Moaswreb Today</title>
<link rel="stylesheet" href="base.css">
<style>
  @font-face { font-family: Brand; src: url(fonts/bc-800i.woff2) format("woff2"); font-weight: 800; font-style: italic; }
  @font-face { font-family: Brand; src: url(fonts/bc-700i.woff2) format("woff2"); font-weight: 700; font-style: italic; }
  .brand { font-family: Brand; font-style: italic; font-weight: 800; letter-spacing: -0.01em; }

  header { padding: 10px 24px 0; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 30px; line-height: 1; }
  .logo i { font-style: normal; display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: var(--ink); margin-left: 2px; }

  .hero { margin: 22px 16px 0; padding: 22px 22px 22px; background: var(--lime); border-radius: 32px; position: relative; overflow: hidden; }
  .hero .route { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600; }
  .hero .route .by { font-weight: 500; opacity: .6; }
  .say { margin-top: 14px; font-size: 40px; line-height: .92; text-transform: uppercase; }
  .big { display: flex; align-items: flex-end; gap: 10px; margin-top: 4px; }
  .big .n { font-size: 196px; line-height: .78; margin-left: -10px; letter-spacing: -0.04em; }
  .big .u { font-size: 54px; line-height: 1; padding-bottom: 6px; text-transform: uppercase; }
  .hero .foot { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; }
  .hero .foot .t { font-size: 16px; font-weight: 600; }
  .hero .foot .t span { opacity: .55; font-weight: 500; }
  .go { height: 44px; padding: 0 18px; border-radius: 22px; background: var(--ink); color: var(--lime); display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }

  .board { margin: 10px 16px 0; display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: var(--fill); }
  .board .txt { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .board .a { font-size: 15px; font-weight: 600; }
  .board .b { font-size: 14px; color: var(--ink-2); }
  .board .eta { font-size: 30px; line-height: 1; }
  .board .eta small { font-size: 15px; }

  .section { margin-top: 30px; padding: 0 24px 2px; display: flex; justify-content: space-between; align-items: baseline; }
  .section h2 { font-size: 26px; text-transform: uppercase; }
  .section span { font-size: 14px; color: var(--ink-3); font-weight: 500; }
  .row { display: flex; align-items: center; padding: 14px 24px; gap: 16px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 1px; background: var(--line); }
  .row .t { width: 66px; font-size: 30px; line-height: 1; }
  .row .main { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .row .name { font-size: 16px; font-weight: 600; }
  .row .meta { font-size: 14px; color: var(--ink-2); }
  .row .routes { display: flex; gap: 4px; }

  nav { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding-top: 10px; background: var(--bg); }
  nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); width: 110px; letter-spacing: 0; }
  nav a.on { color: var(--ink); font-weight: 600; }
  nav svg { width: 24px; height: 24px; }
</style></head>
<body><div class="phone">
  <div class="status"><span>08:37</span><span class="sys"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 11h2V8H1zM5 11h2V6H5zM9 11h2V3H9zM13 11h2V0h-2z" fill="#000"/></svg><span class="bat"></span></span></div>
  <header><span class="logo brand">moaswreb<i></i></span>
    <span class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></header>

  <section class="hero">
    <div class="route"><span>Home → University</span><span class="by">due 09:00</span></div>
    <div class="say brand">You'll make it.<br>Leave in</div>
    <div class="big brand"><span class="n">7</span><span class="u">min</span></div>
    <div class="foot">
      <span class="t">08:44 <span>→</span> 08:57</span>
      <span class="go">Start trip<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </div>
  </section>

  <div class="board">
    <span class="plate">306</span>
    <span class="txt"><span class="a">Vazha-Pshavela Ave</span><span class="b">6 min walk</span></span>
    <span class="eta brand">08:51</span>
  </div>

  <div class="section"><h2 class="brand">Later today</h2><span>3 trips</span></div>
  <div class="row"><span class="t brand">13:20</span><span class="main"><span class="name">University → Home</span><span class="meta">24 min</span></span><span class="routes"><span class="plate metro">M1</span></span></div>
  <div class="row"><span class="t brand">17:05</span><span class="main"><span class="name">Home → Gym</span><span class="meta">18 min</span></span><span class="routes"><span class="plate">17</span></span></div>
  <div class="row"><span class="t brand">21:40</span><span class="main"><span class="name">Gym → Home</span><span class="meta">31 min</span></span><span class="routes"><span class="plate">306</span><span class="plate metro">M1</span></span></div>

  <nav>
    <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</a>
    <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>Chat</a>
    <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>Settings</a>
  </nav>
</div></body></html>
